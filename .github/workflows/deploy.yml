# Build the site on every push to main, publish the build as a .tar.gz
# GitHub release and deploy it to GitHub Pages.
name: Build, release & deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Lint & build
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      archive: ${{ steps.meta.outputs.archive }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Release metadata
        id: meta
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}-build.${GITHUB_RUN_NUMBER}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "archive=becvar.xyz-${TAG}.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Package build
        run: tar -czf "${{ steps.meta.outputs.archive }}" -C dist .

      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: release-archive
          path: ${{ steps.meta.outputs.archive }}
          retention-days: 7

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  release:
    name: GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release archive
        uses: actions/download-artifact@v5
        with:
          name: release-archive

      # Idempotent: on a re-run the release already exists, so just replace the archive.
      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.build.outputs.tag }}
          ARCHIVE: ${{ needs.build.outputs.archive }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists – uploading archive again."
            gh release upload "$TAG" "$ARCHIVE" --repo "$GITHUB_REPOSITORY" --clobber
            exit 0
          fi
          gh release create "$TAG" "$ARCHIVE" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes "Static build of commit ${GITHUB_SHA::7}. Extract with \`tar -xzf ${ARCHIVE}\` and serve the files from any web server." \
            --latest

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
